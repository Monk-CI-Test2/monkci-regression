name: 20 Fast Jobs
run-name: fast-jobs/${{ inputs.runner }}/x${{ inputs.count }}/${{ github.run_id }}

# The scenario behind the production zombie loop: a burst of jobs that each finish
# in a few seconds. GitHub often does not deliver in_progress for these and the
# webhook does not publish their success, so the controller has to learn they are
# done from Postgres. Every job must run, and afterwards the controller must not
# keep claiming VMs for any of them (see scripts/verify-staging-logs.sh).
#
# Runtime: roughly VM boot time plus a minute.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: MonkCI pool label
        default: monkci-ubuntu-24.04-4
        type: choice
        options:
          - monkci-ubuntu-24.04-2
          - monkci-ubuntu-24.04-4
          - monkci-ubuntu-24.04-8
      count:
        description: Number of fast jobs to fire at once
        default: 12
        type: number
      max_queue_seconds:
        description: Fail if any job waited longer than this for a runner
        default: 600
        type: number

permissions:
  contents: read
  actions: read

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
    steps:
      - id: ids
        run: echo "ids=$(seq -s, 1 ${{ inputs.count }} | jq -c 'split(",") | map(tonumber)' -R)" >> "$GITHUB_OUTPUT"

  fast:
    name: fast-${{ matrix.id }}
    needs: plan
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.plan.outputs.ids) }}
    steps:
      - run: echo "fast job ${{ matrix.id }} on $RUNNER_NAME"

  verdict:
    name: verdict
    needs: [plan, fast]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      MAX_QUEUE: ${{ inputs.max_queue_seconds }}
      EXPECTED: ${{ inputs.count }}
    steps:
      - name: Grade
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ needs.fast.result }}" == "success" ]] || { echo "::error::some fast jobs did not succeed (${{ needs.fast.result }})"; FAILED=1; }
          jobs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --jq '.jobs[] | select(.name | startswith("fast-")) | [.name, .conclusion, .created_at, .started_at, .completed_at, .runner_name] | @tsv')
          n=0; worst=0
          {
            echo "## Fast jobs x$EXPECTED on ${{ inputs.runner }}"
            echo ""
            echo "| job | conclusion | queued (s) | ran (s) | runner |"
            echo "|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS=$'\t' read -r name concl created started completed runner; do
            n=$((n+1))
            q=$(( $(date -d "$started" +%s) - $(date -d "$created" +%s) ))
            r=$(( $(date -d "$completed" +%s) - $(date -d "$started" +%s) ))
            (( q > worst )) && worst=$q
            echo "| $name | $concl | $q | $r | $runner |" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$jobs"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- jobs: $n, worst queue wait: ${worst}s (limit ${MAX_QUEUE}s)" >> "$GITHUB_STEP_SUMMARY"
          (( n == EXPECTED )) || { echo "::error::expected $EXPECTED jobs, API returned $n"; FAILED=1; }
          (( worst <= MAX_QUEUE )) || { echo "::error::worst queue wait ${worst}s exceeds ${MAX_QUEUE}s"; FAILED=1; }
          [[ -z "${FAILED:-}" ]]
