name: 20 Fast Jobs
run-name: allotment/${{ inputs.workload || 'fast' }}/${{ inputs.runner }}/x${{ inputs.count }}/${{ inputs.build_id || 'unlabelled' }}

# The scenario behind the production zombie loop: a burst of jobs that each finish
# in a few seconds. GitHub often does not deliver in_progress for these and the
# webhook does not publish their success, so the controller has to learn they are
# done from Postgres. Every job must run, and afterwards the controller must not
# keep claiming VMs for any of them (see scripts/verify-staging-logs.sh).
#
# Runtime: roughly VM boot time plus a minute.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: MonkCI pool label
        default: monkci-ubuntu-24.04-4
        type: choice
        options:
          - monkci-ubuntu-24.04-2
          - monkci-ubuntu-24.04-4
          - monkci-ubuntu-24.04-8
      count:
        description: Number of fast jobs to fire at once
        default: 12
        type: number
      max_queue_seconds:
        description: Fail if any job waited longer than this for a runner
        default: 600
        type: number

      workload:
        description: fast preserves the original test; mixed alternates 0s, 3s, 15s and 30s jobs
        default: fast
        type: choice
        options: [fast, mixed]
      baseline_run_id:
        description: Optional completed run of this workflow with identical count/pool/workload
        default: ""
        type: string
      build_id:
        description: Deployed controller/custom-MIG/agent version label for the report
        default: unlabelled
        type: string

concurrency:
  group: allotment-measurement-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
      - id: ids
        env:
          JOB_COUNT: ${{ inputs.count }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          count = int(os.environ["JOB_COUNT"])
          if not 1 <= count <= 100:
              raise SystemExit("count must be between 1 and 100")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("ids=" + json.dumps(list(range(1, count + 1))) + "\n")
          PYTHON

  fast:
    name: fast-${{ matrix.id }}
    needs: plan
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.plan.outputs.ids) }}
    steps:
      - name: Execute deterministic workload
        env:
          CASE_ID: ${{ matrix.id }}
          WORKLOAD: ${{ inputs.workload || 'fast' }}
        run: |
          python3 - <<'PYTHON'
          import os, time
          case = int(os.environ["CASE_ID"])
          delay = (0, 3, 15, 30)[(case - 1) % 4] if os.environ["WORKLOAD"] == "mixed" else 0
          print(f"ALLOTMENT case={case} hold={delay}s runner={os.environ['RUNNER_NAME']}", flush=True)
          time.sleep(delay)
          PYTHON

  verdict:
    name: verdict
    needs: [plan, fast]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      MAX_QUEUE: ${{ inputs.max_queue_seconds }}
      EXPECTED: ${{ inputs.count }}
      POOL: ${{ inputs.runner }}
      WORKLOAD: ${{ inputs.workload || 'fast' }}
      BUILD_ID: ${{ inputs.build_id || 'unlabelled' }}
      BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Grade every job and compare allocation latency
        run: |
          args=(--run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --pool "$POOL"
                --count "$EXPECTED" --workload "$WORKLOAD" --max-queue "$MAX_QUEUE"
                --build-id "$BUILD_ID" --output .allotment/report.json)
          if [[ -n "$BASELINE_RUN_ID" ]]; then args+=(--baseline-run-id "$BASELINE_RUN_ID"); fi
          python3 scripts/allotment_time.py "${args[@]}"
      - name: Upload exact job and comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allotment-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .allotment/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
